# CI for Core RPG - Quests Engine (NightBeam convention; based on Modern-Building-Wands' ci.yml).
# Builds all 8 jars (1.20.1 Fabric + Forge; 1.21.1, 26.2, 26.3 Fabric + NeoForge), one workspace per job,
# runs each workspace's unit tests (part of `build`), checks that every workspace has the same version= and
# that the metadata ranges stay inside their Minecraft line, checks the 8 built jar names, and runs the
# publisher script tests (the same-day guard), and boots a dev server per target (server-test). It never publishes anything.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - "scripts/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      # Bundled into every jar by the workspaces' multiloader-common.gradle.
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Test publisher scripts (same-day guard)
        run: node --test scripts/*.test.mjs
      - name: Check the 8 targets, one version and metadata ranges
        run: python3 scripts/check_targets.py workspaces

  build:
    name: build ${{ matrix.ws }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ws: "1.20.1"
            key: "1201"
          - ws: "1.21.1"
            key: "1211"
          - ws: "26.2"
            key: "262"
          - ws: "26.3"
            key: "263"
    steps:
      - uses: actions/checkout@v4
      # 21 stays JAVA_HOME (the root build and Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root
      # build hands 26.x JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.ws }} and run its unit tests
        run: |
          chmod +x gradlew "${{ matrix.ws }}/gradlew"
          ./gradlew build${{ matrix.key }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.ws }}
          path: ${{ matrix.ws }}/*/build/libs/corerpg_quests-*.jar
          if-no-files-found: error

  jars:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: built
          merge-multiple: true
      - name: Check the 8 jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh ci-jars
          find built -name 'corerpg_quests-*.jar' -exec cp -f -t fresh/ {} +
          version="$(python3 scripts/check_targets.py version)"
          python3 scripts/check_targets.py jars --version "$version" --dir fresh --list-file ci-jars.txt
          xargs -a ci-jars.txt cp -f -t ci-jars/
          ls -l ci-jars
      - uses: actions/upload-artifact@v4
        with:
          name: corerpg-quests-jars
          path: ci-jars/*.jar
          if-no-files-found: error

  # Boots a dev server per target and runs the quest engine's server commands from a datapack (scripts/server-smoke-test.sh).
  server-test:
    name: Server test, ${{ matrix.loader }} ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: "1.20.1", loader: fabric, optional: false }
          - { minecraft: "1.20.1", loader: forge, optional: false }
          - { minecraft: "1.21.1", loader: fabric, optional: false }
          - { minecraft: "1.21.1", loader: neoforge, optional: false }
          - { minecraft: "26.2", loader: fabric, optional: false }
          - { minecraft: "26.2", loader: neoforge, optional: false }
          - { minecraft: "26.3", loader: fabric, optional: false }
          - { minecraft: "26.3", loader: neoforge, optional: false }
    steps:
      - uses: actions/checkout@v4
      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; 26.x runs on 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ${{ matrix.minecraft }}/gradlew scripts/server-smoke-test.sh
      - name: Run the quest engine's server commands on a dev server
        timeout-minutes: 30
        shell: bash
        run: |
          case "${{ matrix.minecraft }}" in 26.*) export JAVA_HOME="$JAVA_HOME_25_X64" ;; esac
          scripts/server-smoke-test.sh ${{ matrix.minecraft }} ${{ matrix.loader }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            server-smoke-*.log
            ${{ matrix.minecraft }}/${{ matrix.loader }}/runs/server/crash-reports/
            ${{ matrix.minecraft }}/${{ matrix.loader }}/runs/server/logs/
          if-no-files-found: ignore
