# CI for Core RPG - Quests Engine (NightBeam convention; based on Modern-Building-Wands' ci.yml).
# Builds all 8 jars (1.20.1 Fabric + Forge; 1.21.1, 26.2, 26.3 Fabric + NeoForge), one workspace per job,
# runs each workspace's unit tests (part of `build`), checks that every workspace has the same version= and
# that the metadata ranges stay inside their Minecraft line, checks the 8 built jar names, and runs the
# publisher script tests (the same-day guard). It never publishes anything.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - "scripts/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      # Bundled into every jar by the workspaces' multiloader-common.gradle.
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Test publisher scripts (same-day guard)
        run: node --test scripts/*.test.mjs
      - name: Check the 8 targets, one version and metadata ranges
        run: python3 scripts/check_targets.py workspaces

  build:
    name: build ${{ matrix.ws }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ws: "1.20.1"
            key: "1201"
          - ws: "1.21.1"
            key: "1211"
          - ws: "26.2"
            key: "262"
          - ws: "26.3"
            key: "263"
    steps:
      - uses: actions/checkout@v4
      # 21 stays JAVA_HOME (the root build and Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root
      # build hands 26.x JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.ws }} and run its unit tests
        if: hashFiles(format('{0}/settings.gradle', matrix.ws)) != ''
        shell: bash
        run: |
          # TEMP (porting): run the workspace wrapper directly until all 4 workspaces exist for the root build.
          case "${{ matrix.ws }}" in 26.*) export JAVA_HOME="$JAVA_HOME_25_X64" ;; esac
          cd "${{ matrix.ws }}"
          chmod +x gradlew
          ./gradlew build --no-daemon --continue -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      # TEMP (porting): print the Minecraft signatures the port depends on.
      - name: API dump
        if: always()
        shell: bash
        env:
          WS: ${{ matrix.ws }}
        run: |
          set +e
          J=""
          for j in $(find ~/.gradle/caches "$GITHUB_WORKSPACE/$WS" -name '*.jar' -size +8M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/MouseHandler.class'; then J="$j"; break; fi
          done
          echo "jar: $J"
          [ -n "$J" ] || exit 0
          python3 scripts/tmp_api_dump.py "$J" "$WS"
          JP="$JAVA_HOME_21_X64/bin/javap"
          LIST="net.minecraft.client.Screenshot net.minecraft.client.gui.components.toasts.Toast net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.MultiLineEditBox net.minecraft.world.entity.player.Inventory net.minecraft.server.PlayerAdvancements net.minecraft.client.gui.GuiGraphics net.minecraft.world.level.storage.loot.LootDataManager net.minecraft.client.MouseHandler net.minecraft.client.gui.components.toasts.ToastComponent"
          if [ "${WS#26.}" != "$WS" ]; then
            JP="$JAVA_HOME_25_X64/bin/javap"
            LIST="net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.AbstractWidget net.minecraft.ChatFormatting net.minecraft.network.chat.TextColor net.minecraft.server.ReloadableServerRegistries\$Holder net.minecraft.client.input.CharacterEvent net.minecraft.client.input.KeyEvent net.minecraft.client.gui.Gui net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.world.entity.player.Player net.minecraft.client.player.LocalPlayer net.minecraft.client.gui.components.toasts.ToastManager"
          fi
          for c in $LIST; do
            echo "=== $c"
            "$JP" -p -cp "$J" "$c" 2>&1 | grep -v -e '^Compiled' -e 'lambda[$]'
          done
          echo "=== Minecraft (filtered)"
          "$JP" -p -cp "$J" net.minecraft.client.Minecraft 2>&1 | grep -E 'Screen|gui|hasControlDown|hasShiftDown|hasAltDown|oast'
          echo "=== BlockStateBase (filtered)"
          "$JP" -p -cp "$J" 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' 2>&1 | grep -E 'Tag|tags|Holder|getCloneItemStack'
          echo "=== EntityType (filtered)"
          "$JP" -p -cp "$J" net.minecraft.world.entity.EntityType 2>&1 | grep -E ' is[(]|Holder'
      - uses: actions/upload-artifact@v4
        if: hashFiles(format('{0}/settings.gradle', matrix.ws)) != ''
        with:
          name: jars-${{ matrix.ws }}
          path: ${{ matrix.ws }}/*/build/libs/corerpg_quests-*.jar
          if-no-files-found: error

  jars:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: built
          merge-multiple: true
      - name: Check the 8 jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-jars
          find built -name 'corerpg_quests-*.jar' -exec cp -f -t ci-jars/ {} +
          ls -l ci-jars
          version="$(python3 scripts/check_targets.py version)"
          python3 scripts/check_targets.py jars --version "$version" --dir ci-jars --list-file ci-jars.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corerpg-quests-jars
          path: ci-jars/*.jar
          if-no-files-found: error
