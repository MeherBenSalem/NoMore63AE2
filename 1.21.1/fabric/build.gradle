plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    modLocalRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // Loom nests project implementation deps into remapJar; nesting :common produced empty
    // intermediary jars. Sources/resources still come from commonJava/commonResources.
    configurations.implementation.dependencies.removeIf { dep ->
        dep instanceof ProjectDependency && dep.dependencyProject.path == ':common'
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Force remapJar to remap the jar that actually contains our classes (Loom's -dev jar),
// instead of an empty nested-include intermediate.
tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask).configure {
    addNestedDependencies = false
    inputFile.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
}
