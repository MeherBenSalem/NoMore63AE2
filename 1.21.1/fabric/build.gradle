plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        qaServer {
            server()
            setConfigName('Fabric QA Server')
            vmArg '-Dcorerpg_quests.qa.stop_after_ticks=300'
            programArgs '--nogui'
            runDir('runs/qa-server')
        }
        qaClient {
            client()
            setConfigName('Fabric QA Client')
            vmArg "-Dcorerpg_quests.qa.script=${(project.findProperty('qaScript') ?: '').toString()}"
            programArgs '--quickPlaySingleplayer', 'qa', '--width', '1920', '--height', '1080'
            runDir('runs/qa')
        }
        gametest {
            server()
            setConfigName('Fabric Game Test')
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
            runDir('runs/gametest')
        }
    }
}

// Loom's remapJar must remap the jar that actually holds our classes.
tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask).configure {
    addNestedDependencies = false
    inputFile.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        def out = archiveFile.get().asFile
        if (out.length() < 1024) {
            throw new GradleException("remapJar produced an empty/near-empty jar (${out.length()} bytes)")
        }
    }
}
