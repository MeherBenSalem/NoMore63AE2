plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument('--nogui')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
        }
        // QA: a server that generates a world and stops itself, and a client that opens it and runs a script
        // (-PqaScript="wait:60;open:;screenshot:book;quit"). See ClientQa.
        qaServer {
            server()
            gameDirectory = project.file('runs/qa-server')
            programArgument('--nogui')
            systemProperty('corerpg_quests.qa.stop_after_ticks', '300')
        }
        qaClient {
            client()
            gameDirectory = project.file('runs/qa')
            systemProperty('corerpg_quests.qa.script', (project.findProperty('qaScript') ?: '').toString())
            programArguments.addAll('--quickPlaySingleplayer', 'qa', '--width', '1920', '--height', '1080')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
