# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.3
group=nm63ae2
java_version=17

# Common
minecraft_version=1.20.1
mod_name=No More 63 AE2
mod_author=NoMore63AE2
mod_id=no_more_63_ae2
license=LGPL-3.0
credits=
description=Removes AE2's 63 item type limit and allows a configurable item type limit for AE2 storage cells.
minecraft_version_range=[1.20.1, 1.22)
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# AE2
# Fabric interval ranges like [15.4.10,16.0.0) falsely reject AE2 15.4.10 on some Fabric Loader builds.
# Use SemVer predicates for fabric.mod.json; keep Maven interval for Forge/NeoForge mods.toml.
ae2_version=15.4.10
ae2_version_range=[15.4.10,16.0.0)
ae2_version_range_fabric=>=15.4.10

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,)

# NeoForge
neoforge_version=20.4.237
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
